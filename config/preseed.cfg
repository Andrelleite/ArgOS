# Debconf preseed answers for ArgOS.
#
# live-build automatically feeds this file through debconf-set-selections
# inside the chroot before packages are configured, so builds never stop to
# wait on an interactive prompt. Keep every question that any package in
# config/package-lists/ is known to ask here.

# wireshark-common / tshark: don't prompt about non-root packet capture --
# we configure dumpcap's setcap/group access explicitly in the hooks
# instead of granting it here.
wireshark-common	wireshark-common/install-setuid	boolean	false

# Keyboard layout -- generic US layout so the build never blocks on a
# console prompt. Change this if you want a different default layout baked
# into the ISO; it can always be changed at runtime with `dpkg-reconfigure
# keyboard-configuration` or loadkeys.
keyboard-configuration	keyboard-configuration/layout		select	English (US)
keyboard-configuration	keyboard-configuration/layoutcode	string	us
keyboard-configuration	keyboard-configuration/variant		select	English (US)
keyboard-configuration	keyboard-configuration/variantcode	string
keyboard-configuration	keyboard-configuration/model		select	Generic 105-key (Intl) PC
keyboard-configuration	keyboard-configuration/modelcode	string	pc105
keyboard-configuration	keyboard-configuration/xkb-keymap	select	us

# console-setup: pair with the keyboard answers above, and pick a safe
# default console font/charmap so the chroot never prompts.
console-setup	console-setup/charmap47		select	UTF-8
console-setup	console-setup/codeset47		select	Guess optimal character set
console-setup	console-setup/fontface47	select	Fixed
console-setup	console-setup/fontsize-text47	select	16

# debconf itself: never show dialogs at all, even for questions not listed
# above, so an unexpected prompt can't hang the build.
debconf	debconf/priority	select	critical
debconf	debconf/frontend	select	Noninteractive
