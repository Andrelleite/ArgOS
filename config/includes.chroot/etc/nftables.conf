#!/usr/sbin/nft -f
#
# ArgOS default firewall: deny all inbound by default, allow all outbound.
#
# Kali ships nftables as an available package but with an effectively
# empty ruleset (no policy drop, so it accepts everything even when
# installed) -- nothing is actually filtered unless you configure it
# yourself. This is the opposite default: closed unless you explicitly
# open something.
#
# To open a port for a tool you're actively running (e.g. serving an
# exploit callback, hosting a webshell payload), add a rule and reload:
#   sudo nft add rule inet argos_filter input tcp dport 4444 accept
#   sudo systemctl reload nftables
# (nftables starts fresh from this file on every boot/reload, so ad-hoc
# `nft add rule` changes don't persist across reboots unless you also
# add them here.)

flush ruleset

table inet argos_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        icmp type { echo-request, destination-unreachable, time-exceeded } accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert,
                      nd-router-advert, destination-unreachable, packet-too-big,
                      time-exceeded, parameter-problem } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
